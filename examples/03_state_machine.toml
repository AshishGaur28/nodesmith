manifest_version = "1"

[node]
name = "counter_node"
namespace = "/demo"
target_language = "python"

[parameters.limit]
type = "int64"
default = 10

[parameters.step]
type = "int64"
default = 1
[parameters.step.validation]
min = 1

[[parameter_constraints]]
expression = "param.step <= param.limit"
message = "step must not exceed limit"

[state_variables.count]
type = "int64"
initial_value = 0

[[publishers]]
id = "count_pub"
topic = "/demo/count"
type = "std_msgs/msg/Int64"

[[services]]
id = "reset_srv"
name = "/demo/reset"
type = "std_srvs/srv/Trigger"

[interfaces."std_msgs/msg/Int64".fields]
data = "int64"

[interfaces."std_srvs/srv/Trigger".response]
success = "bool"
message = "string"

[[pipelines]]
name = "tick"
expressions = ["let next = state.count + param.step >= param.limit ? 0 : state.count + param.step",
               "state.count = next"]

[pipelines.trigger]
type = "timer"
period_ms = 500
clock = "ros"

[pipelines.output_mapping]
"count_pub.data" = "next"

[[pipelines]]
name = "reset"
expressions = ["state.count = 0"]

[pipelines.trigger]
type = "service"
source = "reset_srv"

[pipelines.output_mapping]
"res.success" = "true"
"res.message" = "\"counter reset\""
