name: ci

on:
  push:
  pull_request:

jobs:
  compiler-checks:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - name: Format and lint
        run: |
          ruff format --check .
          ruff check .
      - name: Product front end against the conformance corpus
        run: pytest
      - name: Corpus against the independent reference
        run: python conformance/verify.py
      - name: Specs and schemas agree
        run: python tools/check_specs.py

  concurrency-primitives:
    # The SPEC-12 reference primitives under ThreadSanitizer.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: SPEC-12 reference primitives under ThreadSanitizer
        run: |
          cd docs/specs/reference/cpp
          g++ -std=c++17 -O1 -g -fsanitize=thread concurrency_primitives_test.cpp -o test -pthread
          ./test
      - name: Numeric helpers and the diagnostics ring under ThreadSanitizer and UBSan
        run: |
          mkdir -p /tmp/rt
          cat templates/cpp_rclcpp/concurrency_primitives.hpp templates/cpp_rclcpp/runtime_helpers.hpp > /tmp/rt/runtime.hpp
          g++ -std=c++17 -O1 -g -Wall -Wextra -fsanitize=thread,undefined -I/tmp/rt tests/cpp/test_runtime_helpers.cpp -o /tmp/rt/test -pthread
          /tmp/rt/test

  jazzy:
    # The generated C++ against real ROS 2 Jazzy: generate the example nodes, build them with colcon, run them and check their behaviour.
    # This is the only job that proves the generated glue code compiles against rclcpp; the local stand-in (tests/support/ros_stub) cannot.
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Generate, build and run the example nodes
        # The same script `tools/jazzy_check.sh` runs on a developer machine (there with --smoke, the default); CI runs every example.
        run: bash tests/jazzy/run.sh --all --lint
