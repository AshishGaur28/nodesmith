name: ci

on:
  push:
  pull_request:

jobs:
  front-end:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - name: Product front end against the conformance corpus
        run: pytest
      - name: Corpus against the independent reference
        run: python conformance/verify.py
      - name: Specs and schemas agree
        run: python tools/check_specs.py

  concurrency-primitives:
    # The SPEC-12 reference primitives under ThreadSanitizer.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd docs/specs/reference/cpp
          g++ -std=c++17 -O1 -g -fsanitize=thread concurrency_primitives_test.cpp -o test -pthread
          ./test

  # M3 adds a `jazzy` job here: container `ros:jazzy`, generate the example nodes, `colcon build`, run their behavioural tests.
