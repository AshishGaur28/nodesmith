[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nodesmith"
version = "0.1.0"
description = "Config-driven ROS 2 node generator (pre-alpha: C++ generation for core manifests, never built against ROS 2)"
classifiers = ["Development Status :: 2 - Pre-Alpha"]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18", "pyyaml>=6", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
nodesmith = "nodesmith.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM", "D100", "D101", "D102", "D103", "D104"]
# N818: ``Cascade`` and ``Fault`` are control-flow signals, not errors a caller reports.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# The C++ emitters contain C++ source text, whose lines are as long as the C++ needs.
"src/nodesmith/generators/cpp/*.py" = ["E501"]
"tests/**" = ["D", "E501", "SIM115", "E731", "B905", "UP031"]
"tools/**" = ["D", "E501", "SIM115", "E402", "E731"]
"conformance/**" = ["D", "E", "N", "SIM", "B", "UP"]
