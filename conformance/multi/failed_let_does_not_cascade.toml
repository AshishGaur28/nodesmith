# `y` fails once; the uses of `y` and `z` that follow add no further errors.
manifest_version = "1"

[node]
name = "t"
namespace = "/"
target_language = "cpp"

[[subscribers]]
id = "s"
topic = "/in"
type = "std_msgs/msg/Float64"

[[publishers]]
id = "p"
topic = "/out"
type = "std_msgs/msg/Float64"

[interfaces."std_msgs/msg/Float64".fields]
data = "float64"

[state_variables.x]
type = "float64"
initial_value = 0.0

[state_variables.n]
type = "float64"
initial_value = 0.0

[[pipelines]]
name = "a"
expressions = [
  "let y = param.nope",
  "let z = y + 1.0",
  "state.x = z"
]
[pipelines.trigger]
type = "subscriber"
source = "s"
[pipelines.output_mapping]
"p.data" = "z"
